<html>
    <head>
        <title>Grid</title>
    </head>
    <style>
        .main {
            display: grid;
            margin : 0 auto;
            grid-template-columns : 1fr 2fr;
            max-width : 1200px;
            gap : 5px;
        }
        .left{
            background-color : red;
            
        }
        .right {
            background-color: blue;
        }
    </style>
    <body>
        <div class="main">
            <div class="left">
                <div class="left-content">
                    <h1>Left</h1>
                </div>
            </div>
            <div class="right">
                <div class="right-content">
                    <h1>Right</h1>
                </div>

            </div>

        </div>
    </body>
</html>
