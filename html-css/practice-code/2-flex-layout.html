<html>
    <head>
        <title>Flex</title>
    </head>
    <style>
        .main {
            display: flex;
            justify-content : center;
            margin : 0 auto;
            max-width : 1200px;
        }
        .left{
            flex : 1;
            background-color : red;
            
        }
        .right {
            flex : 2;
            background-color: blue;
        }
    </style>
    <body>
        <div class="main">
            <div class="left">
                <div class="left-content">
                    <h1>Left</h1>
                </div>
            </div>
            <div class="right">
                <div class="right-content">
                    <h1>Right</h1>
                </div>

            </div>

        </div>
    </body>
</html>
