<html>
    <head>
        <title>VS Code | Bottombar</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    </head>
    <style>
        .container {
            display : flex;
            justify-content : center;
            background-color : #0d1117;
            width : 100%;
            height : 300px;
              
        }
        .left-content {
            flex : 1;
            color : #c3d0e5;
            font-family : "Helvetica Neue", sans-serif;
            margin-left : 80px;
            margin-top : 30px;
        }
        .left-content h2{
            font-size: 30px;
            font-weight : 500;
        }
        .left-content p{
            font-size : 16px;
            color : #9FB1D1;
            line-height : 25px;
        }
        .right-content{
            flex : 2;
            margin-top : 60px;
            display : grid;
            grid-template-columns: 0.3fr 0.3fr 0.1fr;
        }
        .set {
            display : flex;
            color : white;
            font-family : "Monaco" , sans-serif;
            color : #9BA3B4;
            font-weight: 20;
            margin-top : 5px;
        }
        .set span {
            margin-top : 8px;
            margin-left : 10px;
            font-size : 15px;
        }
        .set img {
            width : 35px;
            height : 35px;
            
        }
       
    </style>
    <body>
        <div class="container">
            <div class="left-content">
                <h2>Code in any language</h2>
                <p>VS Code supports almost every major <br> programming language. 
                Several ship in <br> the box, like JavaScript,
                TypeScript, CSS,<br> and HTML, but extensions for 
                others can<br> be found in the VS Code Marketplace.</p>
            </div>

            <div class="right-content">
                <div class="set">
                <img src="icon/language-js.png" alt="js">
                <span>JavaScript</span>
                </div>
                <div class="set">
                <img src="icon/language-ts.png" alt="js">
                <span>TypeScript</span>
                </div>
                <div class="set">
                <img src="icon/language-python.png" alt="js">
                <span>Python</span>
                </div>
                <div class="set">
                <img src="icon/language-cs.png" alt="js">
                <span>C#</span>
                </div>
                <div class="set">
                <img src="icon/language-cpp.png" alt="js">
                <span>C++</span>
                </div>
                <div class="set">
                <img src="icon/language-html.png" alt="js">
                <span>HTML</span>
                </div>
                <div class="set">
                <img src="icon/language-java.png" alt="js">
                <span>Java</span>
                </div>
                <div class="set">
                <img src="icon/language-json.png" alt="js">
                <span>JSON</span>
                </div>
                <div class="set">
                <img src="icon/language-php.png" alt="js">
                <span>PHP</span>
                </div>
                <div class="set">
                <img src="icon/language-markdown.png" alt="js">
                <span>Markdown</span>
                </div>
                <div class="set">
                <img src="icon/language-powershell.png" alt="js">
                <span>Powershell</span>
                </div>
                <div class="set">
                <img src="icon/language-yaml.png" alt="js">
                <span>YAML</span>
                </div> 

            </div>
        </div>
    </body>
</html>
